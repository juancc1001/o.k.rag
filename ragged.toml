[bundle]
root = "bundle"
okf_version = "0.2"
actor = "ragged/0.1.0"
# title = "..."   # heading of the root index.md; omit and it is the project
                  # directory name, which names the tool, not the knowledge

[sources.local]
family = "document"
path = "sources"
include = ["**/*.md", "**/*.txt", "**/*.pdf", "**/*.docx", "**/*.xlsx", "**/*.pptx", "**/*.html"]
exclude = ["**/~$*", "**/.DS_Store"]

[synth]
provider = "gemini"          # gemini | anthropic
model = "gemini-3.1-flash-lite"   # omit for the provider default; `ragged doctor` lists what your key can reach
effort = "high"              # anthropic only; gemini has no equivalent
max_tokens = 16000

[types]
allowed = ["Document", "Concept", "Entity", "Process", "Decision", "Reference"]
allow_new = true

[vectors]
provider = "gemini"          # gemini | fastembed (fastembed is an optional extra)
# model = "gemini-embedding-001"   # omit for the provider default
dim = 768                    # requested output width; fastembed's 384 is fixed
knn_k = 8
ghost_threshold = 0.82       # tau; uncalibrated, see DESIGN.md §12 Risk 1

[projection]
method = "umap"              # umap | pca; umap-learn is an optional extra
random_state = 42            # fixed, or the layout reshuffles every ingest
