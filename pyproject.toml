[project]
name = "ragged"
version = "0.1.0"
description = "Turn a folder of files into a conformant OKF v0.2 knowledge bundle"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "google-genai>=1.0",
    "markitdown[all]>=0.1",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "okflint>=0.3.1"]
# both deliberately optional: umap-learn pulls numba, fastembed pulls ~150 MB of
# onnxruntime, and neither is needed to produce or validate a bundle
umap = ["umap-learn>=0.5"]
fastembed = ["fastembed>=0.4"]

[project.scripts]
ragged = "ragged.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragged"]
