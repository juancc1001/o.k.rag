[project]
name = "okragged"
version = "0.1.0"
description = "Turn a folder of files into a conformant OKF v0.2 knowledge bundle"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "juancc1001", email = "carvallojuanc@gmail.com"}]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.69",
    "google-genai>=1.0",
    "markitdown[all]>=0.1",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# mcp is in dev for the same reason okflint is: without it the tests that need it
# skip, and a suite that quietly skips its server tests is not a passing suite
dev = ["pytest>=8.0", "okflint>=0.3.1", "mcp>=2.0", "fastapi>=0.115", "markdown-it-py>=3.0"]
# all three deliberately optional: umap-learn pulls numba, fastembed pulls ~150 MB
# of onnxruntime, and the MCP SDK pulls starlette, uvicorn and opentelemetry for a
# server that speaks over a pipe. None is needed to produce or validate a bundle.
umap = ["umap-learn>=0.5"]
fastembed = ["fastembed>=0.4"]
mcp = ["mcp>=2.0"]
# the graph view's server half. markdown-it-py renders the concept body for the
# side panel; it arrives transitively today, and depending on that would be luck
api = ["fastapi>=0.115", "uvicorn>=0.30", "markdown-it-py>=3.0"]

[project.scripts]
okragged = "okragged.cli:app"

[project.urls]
Homepage = "https://github.com/juancc1001/ragged"
Repository = "https://github.com/juancc1001/ragged"
Issues = "https://github.com/juancc1001/ragged/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okragged"]

# the built graph view, which Vite writes into the package rather than into
# web/dist so that one build serves a checkout and an installed user alike. Absent
# from a source tree where `npm run build` has never run, which is why `okragged
# serve` reports it as missing instead of failing.
artifacts = ["src/okragged/api/static/**"]
